[project]
name = "dprd-absensi"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[all]==0.111.1",
    "uvicorn[standard]==0.29.0",
    "sqlalchemy==2.0.30",
    "alembic==1.13.1",
    "psycopg2-binary==2.9.9",
    "pydantic-settings==2.2.1",
    "insightface==0.7.3",
    "onnxruntime==1.17.3",
    "opencv-python-headless==4.9.0.80",
    "numpy==1.26.4",
    "pillow==10.3.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.2.1",
    "cryptography==42.0.8",
    "python-multipart==0.0.9",
    "aiofiles==23.2.1",
    "pandas==2.2.2",
    "openpyxl==3.1.3",
    "matplotlib==3.9.4",
    "apscheduler==3.10.4",
]

[tool.vercel]
entrypoint = "main:app"

[tool.vercel.fastapi.static]
exclude = true
